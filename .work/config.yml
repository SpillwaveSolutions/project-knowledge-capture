# Machine-readable settings. The agent file (CLAUDE.md / AGENTS.md) carries
# policy only. Scripts read THIS file.
version: 1

project:
  key: PKC
  name: "Project Knowledge Capture"

ticketing:
  system: github               # github | gitlab | jira | ado | linear | codecatalyst | other | none
  repo: SpillwaveSolutions/project-knowledge-capture

# PKC does not publish (docs/integration-okf-wikiticket.md): docs live in-repo,
# WikiTicket owns the wiki plane. Flip to github-wiki to enable wiki-publish.
wiki:
  system: none                 # github-wiki | gitlab-wiki | ado-wiki | confluence | other | none

release:
  sync_docs:            # docs regenerated by background agents at every release
    - design-doc        # docs/designs/current_design_doc.md + dated freeze
    - code-walkthrough  # docs/designs/current_code_walkthrough.md + dated freeze
    - user-guide        # docs/user_guide/*.md refreshed against diff since last tag
    - readme            # README.md same

paths:
  plans: docs/plans
  status: docs/status
  roadmap: docs/roadmap.md
installed: 0.15.0
